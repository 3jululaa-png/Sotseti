<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung Camera Ultimate</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        /* SVG иконки */
        .icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
            display: inline-block;
            vertical-align: middle;
        }

        /* Верхняя панель */
        .top-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 10px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
            font-size: 0.85rem;
            color: #e2e8f0;
        }

        .top-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            opacity: 0.9;
        }

        .top-btn.active {
            color: #facc15;
            font-weight: bold;
        }

        /* Выпадающие меню выбора (Разрешение / Фильтры) */
        .popup-menu {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            backdrop-filter: blur(10px);
            min-width: 150px;
            text-align: center;
        }

        .popup-menu button {
            background: none;
            border: none;
            color: #fff;
            padding: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 6px;
        }

        .popup-menu button:hover, .popup-menu button.active {
            background: rgba(250, 204, 21, 0.2);
            color: #facc15;
        }

        /* Область камеры */
        .camera-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center;
            transition: transform 0.1s ease-out;
        }

        #zoomIndicator {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #facc15;
            font-weight: bold;
            z-index: 5;
            display: none;
        }

        #timerDisplay {
            position: absolute;
            z-index: 5;
            font-size: 5rem;
            font-weight: bold;
            color: #facc15;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            display: none;
        }

        /* Индикатор записи видео */
        #recIndicator {
            position: absolute;
            top: 70px;
            left: 20px;
            background: rgba(239, 68, 68, 0.8);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            display: none;
            z-index: 5;
            align-items: center;
            gap: 5px;
        }
        #recDot {
            width: 8px; height: 8px; background: #fff; border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Нижняя панель */
        .bottom-panel {
            z-index: 10;
            background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.4), transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
        }

        /* Зумы до 100x */
        .zoom-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 12px;
            border-radius: 20px;
            overflow-x: auto;
            max-width: 95%;
            scrollbar-width: none;
        }
        .zoom-row::-webkit-scrollbar { display: none; }

        .zoom-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            white-space: nowrap;
        }
        .zoom-btn.active {
            background: rgba(255, 255, 255, 0.25);
            color: #facc15;
        }

        /* Режимы съёмки */
        .modes-scroll {
            display: flex;
            gap: 25px;
            overflow-x: auto;
            width: 100%;
            padding: 0 20px 15px 20px;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .modes-scroll::-webkit-scrollbar { display: none; }

        .mode-item {
            color: #888;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }
        .mode-item.active {
            color: #facc15;
        }

        /* Кнопки управления */
        .action-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            padding: 0 30px;
        }

        .gallery-preview {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #fff;
            overflow: hidden;
            background: #222;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .gallery-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .capture-btn {
            width: 75px;
            height: 75px;
            background: transparent;
            border: 4px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }
        .capture-btn::after {
            content: '';
            width: 63px;
            height: 63px;
            background: #fff;
            border-radius: 50%;
            transition: 0.1s;
        }
        /* Стиль кнопки во время записи видео (красный квадрат) */
        .capture-btn.recording {
            border-color: #ef4444;
        }
        .capture-btn.recording::after {
            background: #ef4444;
            border-radius: 8px;
            width: 35px;
            height: 35px;
        }

        .switch-cam-btn {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Модальное окно просмотра */
        #modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #modal img, #modal video {
            max-width: 90%; max-height: 80%;
            border-radius: 10px;
        }
        #modal button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        canvas { display: none; }
    </style>
</head>
<body>

    <div id="zoomIndicator">1.0×</div>
    <div id="recIndicator"><div id="recDot"></div> <span id="recTime">00:00</span></div>

    <!-- Верхняя панель (SVG иконки) -->
    <div class="top-bar">
        <button class="top-btn" id="flashBtn" title="Вспышка">
            <svg class="icon" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
            <span>Выкл</span>
        </button>
        <button class="top-btn" id="timerBtn" title="Таймер">
            <svg class="icon" viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
            <span>Выкл</span>
        </button>
        <button class="top-btn" id="ratioMenuBtn" title="Разрешение">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
            <span id="currentRatioText">Full</span>
        </button>
        <button class="top-btn" id="filterMenuBtn" title="Фильтры">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.42-1.42C8.93 19.62 10.42 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
            <span>Эффекты</span>
        </button>
    </div>

    <!-- Меню выбора разрешения -->
    <div id="ratioPopup" class="popup-menu">
        <button onclick="setRatio('Full')" class="active">Full (На весь экран)</button>
        <button onclick="setRatio('4:3')">4:3 (Стандарт)</button>
        <button onclick="setRatio('1:1')">1:1 (Квадрат)</button>
        <button onclick="setRatio('16:9')">16:9 (Широкий)</button>
    </div>

    <!-- Меню фильтров -->
    <div id="filterPopup" class="popup-menu">
        <button onclick="setFilter('none')" class="active">Оригинал</button>
        <button onclick="setFilter('sepia(0.4) contrast(1.1)')">Теплый</button>
        <button onclick="setFilter('hue-rotate(180deg) saturate(1.2)')">Холодный</button>
        <button onclick="setFilter('sepia(0.8) contrast(1.3) grayscale(0.2)')">Винтаж</button>
        <button onclick="setFilter('grayscale(1) contrast(1.3)')">Ч / Б</button>
    </div>

    <!-- Область камеры -->
    <div class="camera-container" id="cameraBox">
        <div id="timerDisplay">3</div>
        <video id="video" autoplay playsinline muted></video>
    </div>

    <!-- Нижняя панель -->
    <div class="bottom-panel">
        
        <!-- Зумы до 100x -->
        <div class="zoom-row">
            <button class="zoom-btn" data-zoom="0.6">0.6×</button>
            <button class="zoom-btn active" data-zoom="1">1×</button>
            <button class="zoom-btn" data-zoom="2">2×</button>
            <button class="zoom-btn" data-zoom="10">10×</button>
            <button class="zoom-btn" data-zoom="30">30×</button>
            <button class="zoom-btn" data-zoom="50">50×</button>
            <button class="zoom-btn" data-zoom="100">100×</button>
        </div>

        <!-- Режимы съёмки -->
        <div class="modes-scroll">
            <span class="mode-item" data-mode="food">ЕДА</span>
            <span class="mode-item" data-mode="pro">ПРО</span>
            <span class="mode-item active" data-mode="photo">ФОТОГРАФИЯ</span>
            <span class="mode-item" data-mode="video">ВИДЕОЗАПИСЬ</span>
        </div>

        <!-- Кнопки управления -->
        <div class="action-row">
            <div class="gallery-preview" id="galleryPreview" title="Открыть фото/видео">
                <span style="font-size: 9px; color: #777;">Пусто</span>
            </div>
            
            <button id="captureBtn" class="capture-btn" title="Снять"></button>
            
            <button id="switchBtn" class="switch-cam-btn" title="Переключить камеру">
                <svg class="icon" viewBox="0 0 24 24"><path d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm0-10c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"/></svg>
            </button>
        </div>
    </div>

    <!-- Модальное окно просмотра -->
    <div id="modal">
        <div id="modalContentContainer"></div>
        <button onclick="closeModal()">Закрыть</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const switchBtn = document.getElementById('switchBtn');
        const galleryPreview = document.getElementById('galleryPreview');
        const zoomBtns = document.querySelectorAll('.zoom-btn');
        const modeItems = document.querySelectorAll('.mode-item');
        
        const flashBtn = document.getElementById('flashBtn');
        const timerBtn = document.getElementById('timerBtn');
        const ratioMenuBtn = document.getElementById('ratioMenuBtn');
        const ratioPopup = document.getElementById('ratioPopup');
        const filterMenuBtn = document.getElementById('filterMenuBtn');
        const filterPopup = document.getElementById('filterPopup');
        const currentRatioText = document.getElementById('currentRatioText');
        const cameraBox = document.getElementById('cameraBox');

        const timerDisplay = document.getElementById('timerDisplay');
        const zoomIndicator = document.getElementById('zoomIndicator');
        const recIndicator = document.getElementById('recIndicator');
        const recTime = document.getElementById('recTime');
        const modal = document.getElementById('modal');
        const modalContentContainer = document.getElementById('modalContentContainer');

        let useFrontCamera = false;
        let currentStream = null;
        let currentZoom = 1;
        let flashState = 0;
        let timerSeconds = 0;
        let activeMode = 'photo'; // photo или video
        let lastMediaURL = '';
        let isMediaTypeVideo = false;

        // Переменные для видеозаписи
        let mediaRecorder = null;
        let recordedChunks = [];
        let recInterval = null;
        let recSeconds = 0;

        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: { 
                        facingMode: useFrontCamera ? 'user' : 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: activeMode === 'video'
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                video.play();
            } catch (err) {
                console.error(err);
                alert('Разрешите доступ к камере в браузере!');
            }
        }

        initCamera();

        // Переключение камеры (Фронталка больше НЕ зеркалится наоборот)
        switchBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            if (useFrontCamera) {
                video.style.transform = `scale(${currentZoom})`; // Без scaleX(-1), чтобы не было зеркально
            }
            initCamera();
        });

        // Зумы
        zoomBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                zoomBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentZoom = parseFloat(e.target.getAttribute('data-zoom'));
                
                video.style.transform = `scale(${currentZoom})`;

                zoomIndicator.textContent = `${currentZoom}×`;
                zoomIndicator.style.display = 'block';
                clearTimeout(window.zoomTimer);
                window.zoomTimer = setTimeout(() => {
                    zoomIndicator.style.display = 'none';
                }, 1500);
            });
        });

        // Меню разрешений и фильтров
        ratioMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            ratioPopup.style.display = ratioPopup.style.display === 'flex' ? 'none' : 'flex';
            filterPopup.style.display = 'none';
        });

        filterMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            filterPopup.style.display = filterPopup.style.display === 'flex' ? 'none' : 'flex';
            ratioPopup.style.display = 'none';
        });

        document.addEventListener('click', () => {
            ratioPopup.style.display = 'none';
            filterPopup.style.display = 'none';
        });

        function setRatio(ratio) {
            currentRatioText.textContent = ratio;
            ratioPopup.style.display = 'none';
            
            // Меняем соотношение сторон контейнера камеры
            if (ratio === 'Full') {
                cameraBox.style.aspectRatio = 'unset';
                cameraBox.style.height = '100%';
            } else if (ratio === '4:3') {
                cameraBox.style.aspectRatio = '3/4';
                cameraBox.style.height = 'auto';
            } else if (ratio === '1:1') {
                cameraBox.style.aspectRatio = '1/1';
                cameraBox.style.height = 'auto';
            } else if (ratio === '16:9') {
                cameraBox.style.aspectRatio = '16/9';
                cameraBox.style.height = 'auto';
            }
        }

        function setFilter(filterStyle) {
            video.style.filter = filterStyle;
            filterPopup.style.display = 'none';
        }

        // Режимы съемки
        modeItems.forEach(item => {
            item.addEventListener('click', (e) => {
                modeItems.forEach(i => i.classList.remove('active'));
                e.target.classList.add('active');
                
                let mode = e.target.getAttribute('data-mode');
                activeMode = mode === 'video' ? 'video' : 'photo';

                if (mode === 'video') {
                    captureBtn.title = 'Начать запись';
                } else {
                    captureBtn.title = 'Снять фото';
                }

                // Перезапускаем камеру для активации звука при видеозаписи
                initCamera();
            });
        });

        // Вспышка
        flashBtn.addEventListener('click', async () => {
            flashState = (flashState + 1) % 3;
            const texts = ['Выкл', 'Авто', 'Вкл'];
            flashBtn.querySelector('span').textContent = texts[flashState];
            
            try {
                const track = currentStream.getVideoTracks()[0];
                const capabilities = track.getCapabilities();
                if (capabilities.torch) {
                    await track.applyConstraints({ advanced: [{ torch: flashState === 2 }] });
                }
            } catch (e) {}
        });

        // Таймер
        timerBtn.addEventListener('click', () => {
            if (timerSeconds === 0) timerSeconds = 3;
            else if (timerSeconds === 3) timerSeconds = 5;
            else if (timerSeconds === 5) timerSeconds = 10;
            else timerSeconds = 0;
            
            timerBtn.querySelector('span').textContent = timerSeconds === 0 ? 'Выкл' : `${timerSeconds}с`;
        });

        // Кнопка затвора / записи видео
        captureBtn.addEventListener('click', () => {
            if (!currentStream) return;

            if (activeMode === 'video') {
                toggleVideoRecording();
            } else {
                if (timerSeconds > 0) {
                    let timeLeft = timerSeconds;
                    timerDisplay.textContent = timeLeft;
                    timerDisplay.style.display = 'block';

                    let countdown = setInterval(() => {
                        timeLeft--;
                        if (timeLeft > 0) {
                            timerDisplay.textContent = timeLeft;
                        } else {
                            clearInterval(countdown);
                            timerDisplay.style.display = 'none';
                            takePhoto();
                        }
                    }, 1000);
                } else {
                    takePhoto();
                }
            }
        });

        // Съемка фото (фронталка не зеркалится)
        function takePhoto() {
            canvas.width = video.videoWidth || 1920;
            canvas.height = video.videoHeight || 1080;

            const ctx = canvas.getContext('2d');
            
            // Применяем фильтр к канвасу
            ctx.filter = video.style.filter || 'none';

            if (currentZoom > 1) {
                let w = canvas.width / currentZoom;
                let h = canvas.height / currentZoom;
                let x = (canvas.width - w) / 2;
                let y = (canvas.height - h) / 2;
                ctx.drawImage(video, x, y, w, h, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }

            lastMediaURL = canvas.toDataURL('image/jpeg', 0.95);
            isMediaTypeVideo = false;

            galleryPreview.innerHTML = `<img src="${lastMediaURL}" alt="Photo">`;

            const link = document.createElement('a');
            link.href = lastMediaURL;
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            link.download = `Samsung_Photo_${timestamp}.jpg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Логика видеозаписи
        function toggleVideoRecording() {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                recordedChunks = [];
                try {
                    mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/webm' });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(currentStream); // Авто-выбор кодека
                }

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    lastMediaURL = URL.createObjectURL(blob);
                    isMediaTypeVideo = true;

                    galleryPreview.innerHTML = `<video src="${lastMediaURL}" style="width:100%;height:100%;object-fit:cover;"></video>`;

                    const link = document.createElement('a');
                    link.href = lastMediaURL;
                    const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                    link.download = `Samsung_Video_${timestamp}.webm`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                };

                mediaRecorder.start();
                captureBtn.classList.add('recording');
                recIndicator.style.display = 'flex';
                recSeconds = 0;
                recTime.textContent = '00:00';
                recInterval = setInterval(() => {
                    recSeconds++;
                    let m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
                    let s = String(recSeconds % 60).padStart(2, '0');
                    recTime.textContent = `${m}:${s}`;
                }, 1000);

            } else {
                mediaRecorder.stop();
                captureBtn.classList.remove('recording');
                recIndicator.style.display = 'none';
                clearInterval(recInterval);
            }
        }

        // Просмотр в галерее
        galleryPreview.addEventListener('click', () => {
            if (lastMediaURL) {
                modalContentContainer.innerHTML = isMediaTypeVideo 
                    ? `<video src="${lastMediaURL}" controls autoplay></video>`
                    : `<img src="${lastMediaURL}" alt="Preview">`;
                modal.style.display = 'flex';
            }
        });

        function closeModal() {
            modal.style.display = 'none';
            modalContentContainer.innerHTML = '';
